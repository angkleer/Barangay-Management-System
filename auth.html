<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Biasong Management System</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="login-card">
                <button type="button" id="backToWelcomeBtn" class="back-to-welcome-btn">
                    <i class="fas fa-arrow-left"></i> Back to Welcome Page
                </button>
                <h1><i class="fas fa-home"></i> Barangay Biasong Management System</h1>
                <p id="authLead">Sign in to the barangay portal.</p>

                <div class="auth-tabs" role="tablist" aria-label="Authentication">
                    <button type="button" class="auth-tab active" data-auth-view="login">Login</button>
                    <button type="button" class="auth-tab" data-auth-view="user-signup">Signup</button>
                </div>

                <div id="login" class="auth-panel active">
                    <form id="loginForm">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" placeholder="Username" required>
                        </div>
                        <div class="input-group password-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Password" required>
                            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary auth-submit">Login</button>
                    </form>
                    <div id="loginError" class="error-message"></div>
                </div>

                <div id="user-signup" class="auth-panel">
                    <form id="signupForm">
                        <div class="input-grid">
                            <div class="input-group">
                                <i class="fas fa-id-card"></i>
                                <input type="text" id="signupFullName" placeholder="Full Name" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="signupUsername" placeholder="Username" required>
                            </div>
                        </div>
                        <div class="input-grid">
                            <div class="input-group">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="signupEmail" placeholder="Email Address" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="signupContact" placeholder="Contact Number" required>
                            </div>
                        </div>
                        <div class="input-grid">
                            <div class="input-group">
                                <i class="fas fa-calendar-day"></i>
                                <input type="date" id="signupBirthdate" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-user-tag"></i>
                                <select id="signupGender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Prefer not to say">Prefer not to say</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-grid">
                            <div class="input-group password-group">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="signupPassword" placeholder="Password" required>
                                <button type="button" class="password-toggle" data-toggle-password="signupPassword" aria-label="Show password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="input-group password-group">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                                <button type="button" class="password-toggle" data-toggle-password="signupConfirmPassword" aria-label="Show password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary auth-submit">Create User Account</button>
                    </form>
                    <div id="signupError" class="error-message"></div>
                    <div id="signupSuccess" class="success-message"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js?v=20260512-2305"></script>
    <script src="js/core/manager.js?v=20260512-2305"></script>
    <script src="js/core/routing.js?v=20260512-2305"></script>
    <script src="js/core/events.js?v=20260512-2305"></script>
    <script src="js/core/data.js?v=20260512-2305"></script>
    <script src="js/modules/ui-common.js?v=20260512-2305"></script>
    <script src="js/modules/auth.js?v=20260512-2305"></script>
    <script src="js/bootstrap/init.js?v=20260512-2305"></script>
</body>
</html>
